[project]
name = "axvigil-verifier"
version = "0.1.0"
description = "Deterministic sandboxed grader for AxVigil challenges"
requires-python = ">=3.10"
dependencies = []  # keccak-256 is vendored; forge + solc are external tools

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
