[package]
name = "axvigil-record"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "NEAR testnet record of an AxVigil verifier seal, challenge window, and reputation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
