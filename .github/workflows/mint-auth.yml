name: MintAuth

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'verifier/**'
      - '.github/workflows/mint-auth.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'verifier/**'
      - '.github/workflows/mint-auth.yml'

permissions:
  contents: read

jobs:
  test:
    name: Verify EIP-712 MintAuth bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run signature recovery test
        run: python -m unittest backend/test_mint_auth.py -v
