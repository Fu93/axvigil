name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pip install -r requirements-dev.txt
      - run: forge test --root contracts
      - run: pytest -q
      - run: python -m scripts.calibrate --variants 20
      - run: docker build -f verifier/Dockerfile -t axvigil-grader:local .
      - run: python -m scripts.sandbox_smoke
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
