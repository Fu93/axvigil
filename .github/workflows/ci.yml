name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build
        run: forge build
      - name: forge test
        run: forge test -vv
      - name: forge test (gas report)
        run: forge test --gas-report --no-match-test test_productionFullSupply

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Warm the solc cache (so offline grading can compile)
        run: forge build
        working-directory: contracts
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r backend/requirements.txt
      - name: verifier tests
        run: python -m pytest -q
        working-directory: verifier
      - name: variantgen tests
        run: PYTHONPATH=. python -m pytest -q
        working-directory: variantgen
      - name: backend tests
        run: PYTHONPATH=. python -m pytest -q
        working-directory: backend
