name: Web

on:
  push:
    branches: [main, "**"]
    paths:
      - "web/**"
      - "scripts/check_web.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/check_web.py"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static web integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local links and assets
        run: python scripts/check_web.py
