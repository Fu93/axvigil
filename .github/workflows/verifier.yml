name: Verifier

on:
  push:
    branches: [main]
    paths:
      - 'challenges/**'
      - 'verifier/**'
      - 'contracts/lib/**'
      - '.github/workflows/verifier.yml'
      - 'SPEC.md'
  pull_request:
    paths:
      - 'challenges/**'
      - 'verifier/**'
      - 'contracts/lib/**'
      - '.github/workflows/verifier.yml'
      - 'SPEC.md'

permissions:
  contents: read

jobs:
  sample-grade:
    name: Grade sample reentrancy submission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install -r verifier/requirements.txt

      - name: Grade sample submission
        run: |
          python -m verifier.reentrancy_grader \
            --challenge challenges/reentrancy-001 \
            --patch challenges/reentrancy-001/submissions/sample.patch \
            --poc challenges/reentrancy-001/submissions/sample_poc.t.sol \
            --json
