name: NEAR

on:
  push:
    paths:
      - 'near/**'
      - '.github/workflows/near.yml'
  pull_request:
    paths:
      - 'near/**'
      - '.github/workflows/near.yml'

permissions:
  contents: read

jobs:
  contract:
    name: axvigil-record unit tests and wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Unit tests
        run: cargo test --manifest-path near/contract/Cargo.toml --locked
      - name: Release wasm
        run: cargo build --manifest-path near/contract/Cargo.toml --release --target wasm32-unknown-unknown --locked

  bridge:
    name: verifier seal and testnet guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Bridge tests
        run: PYTHONPATH=near/python python -m pytest near/python/tests -q
